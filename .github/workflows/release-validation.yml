name: release-validation

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  push:
    branches:
      - gamma/release-foundation
    tags:
      - 'v*'

jobs:
  pluginval-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build and headless GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libfontconfig1-dev libfreetype6-dev libgl1-mesa-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev xvfb unzip curl
      - name: Configure lightweight Release
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSOLARIS_ENABLE_NEURAL_AUDIO=OFF -DSOLARIS_BUILD_BENCHMARK=OFF
      - name: Build VST3
        run: cmake --build build --config Release --target SolarisSilverline_VST3 --parallel 2
      - name: Download pluginval 1.0.4
        run: |
          curl -L https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Linux.zip -o pluginval.zip
          unzip -q pluginval.zip -d pluginval-dist
          chmod +x pluginval-dist/pluginval
      - name: Run pluginval strictness 5
        run: |
          VST3="$(find build -type d -name 'Solaris Silverline.vst3' -print -quit)"
          test -n "$VST3"
          xvfb-run -a pluginval-dist/pluginval --strictness-level 5 --skip-gui-tests "$VST3"
