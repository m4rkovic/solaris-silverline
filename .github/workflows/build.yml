name: build

on:
  push:
  pull_request:
    branches: [ main ]

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-release:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        neural: [ON, OFF]
    name: linux-release / NeuralAudio ${{ matrix.neural }}

    steps:
      - uses: actions/checkout@v4
      - name: Install JUCE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libfontconfig1-dev libfreetype6-dev libgl1-mesa-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev
      - name: Configure Release
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DSOLARIS_ENABLE_NEURAL_AUDIO=${{ matrix.neural }}
          -DSOLARIS_BUILD_TESTS=ON
          -DSOLARIS_BUILD_BENCHMARK=ON
      - name: Build VST3, Standalone, DSP tests and benchmark
        run: cmake --build build --config Release --target SolarisSilverline_VST3 SolarisSilverline_Standalone SolarisDspTests SolarisBenchmark --parallel 2
      - name: Run DSP sanity tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Analogue offline benchmark smoke test
        run: |
          BENCH="$(find build -type f -name 'SolarisBenchmark' -perm -111 -print -quit)"
          test -n "$BENCH"
          "$BENCH" --seconds 1
      - name: Real NAM smoke test at 48k and 44.1k
        if: matrix.neural == 'ON'
        run: |
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/sdatkinson/NeuralAmpModelerPlugin/16be869746b8915885c7a35bafdcc0061faeb50e/REAPER/model.nam \
            -o nam-reference-model.nam
          BENCH="$(find build -type f -name 'SolarisBenchmark' -perm -111 -print -quit)"
          test -n "$BENCH"
          "$BENCH" --seconds 0.5 --nam nam-reference-model.nam --sample-rate 48000
          "$BENCH" --seconds 0.5 --nam nam-reference-model.nam --sample-rate 44100
      - name: Package release artifacts
        run: bash scripts/package.sh build
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SolarisSilverline-linux-neural-${{ matrix.neural }}
          path: dist/
          if-no-files-found: error

  windows-release:
    runs-on: windows-2022
    name: windows-msvc-release / NeuralAudio ON
    steps:
      - uses: actions/checkout@v4
      - name: Configure Release
        shell: pwsh
        run: cmake -S . -B build -A x64 -DSOLARIS_ENABLE_NEURAL_AUDIO=ON -DSOLARIS_BUILD_TESTS=ON -DSOLARIS_BUILD_BENCHMARK=ON
      - name: Build VST3, Standalone, DSP tests and benchmark
        shell: pwsh
        run: cmake --build build --config Release --target SolarisSilverline_VST3 SolarisSilverline_Standalone SolarisDspTests SolarisBenchmark --parallel 2
      - name: Run DSP sanity tests
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Analogue offline benchmark smoke test
        shell: pwsh
        run: |
          $bench = Get-ChildItem -Path build -Recurse -Filter "SolarisBenchmark.exe" | Select-Object -First 1
          if ($null -eq $bench) { throw "SolarisBenchmark.exe not found" }
          & $bench.FullName --seconds 1
      - name: Real NAM smoke test at 48k and 44.1k
        shell: pwsh
        run: |
          curl.exe -L --fail --retry 3 "https://raw.githubusercontent.com/sdatkinson/NeuralAmpModelerPlugin/16be869746b8915885c7a35bafdcc0061faeb50e/REAPER/model.nam" -o nam-reference-model.nam
          if ($LASTEXITCODE -ne 0) { throw "Could not download NAM reference model" }
          $bench = Get-ChildItem -Path build -Recurse -Filter "SolarisBenchmark.exe" | Select-Object -First 1
          if ($null -eq $bench) { throw "SolarisBenchmark.exe not found" }
          & $bench.FullName --seconds 0.5 --nam nam-reference-model.nam --sample-rate 48000
          if ($LASTEXITCODE -ne 0) { throw "NAM 48k smoke test failed" }
          & $bench.FullName --seconds 0.5 --nam nam-reference-model.nam --sample-rate 44100
          if ($LASTEXITCODE -ne 0) { throw "NAM 44.1k SRC smoke test failed" }
      - name: Package release artifacts
        shell: pwsh
        run: .\scripts\package.ps1 -BuildDir build -Config Release
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SolarisSilverline-windows-neural-ON
          path: dist/
          if-no-files-found: error
