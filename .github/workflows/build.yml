name: build

on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  linux-vst3:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        neural: [ON, OFF]

    name: linux-vst3 / NeuralAudio ${{ matrix.neural }}

    steps:
      - uses: actions/checkout@v4

      - name: Install JUCE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxrandr-dev

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DSOLARIS_ENABLE_NEURAL_AUDIO=${{ matrix.neural }}

      - name: Build VST3 and DSP tests
        run: cmake --build build --config Release --target SolarisSilverline_VST3 SolarisDspTests --parallel 2

      - name: Run DSP sanity tests
        run: ctest --test-dir build -C Release --output-on-failure
